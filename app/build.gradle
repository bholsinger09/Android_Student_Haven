plugins {
    id 'com.android.application'
}

android {
    namespace 'com.studenthaven.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.studenthaven.android'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'BACKEND_URL', '"http://127.0.0.1:8088/api/v1/"'
        }
        release {
            buildConfigField 'String', 'BACKEND_URL', '""'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
}

tasks.register('exportDebugApk', Copy) {
    dependsOn 'assembleDebug'
    from layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')
    into rootProject.layout.projectDirectory.dir('dist')
    rename 'app-debug.apk', 'student-haven-debug.apk'
}
